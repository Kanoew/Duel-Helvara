<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Duel d'Helvara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Marcellus+SC&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --ink:#0a0e16;
  --deep:#111827;
  --lake:#1a2740;
  --line:#2a3a57;
  --mist:#8ea3c0;
  --frost:#e2eaf5;
  --warm:#dba862;
  --ko:#f0a0a0;
  --me:#6fb8de;
  --foe:#9a8cd0;
  --helvara:#4f86b8;
  --primordial:#8f74dc;
  --desir:#d6ab5e;
  --jugement:#b9c3d2;
  --display:"Marcellus", "Cormorant Garamond", Georgia, serif;
  --sc:"Marcellus SC", "Marcellus", Georgia, serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 60% at 50% 48%, #13203a 0%, transparent 70%),
    var(--ink);
  color:var(--frost);
  font:14px/1.45 var(--body);
  margin:0;
  padding-inline:16px;
  padding-block:12px 24px;
}
button{font:inherit;color:inherit}
button:focus-visible,label:focus-within,[data-act]:focus-visible{outline:2px solid var(--me);outline-offset:2px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,14,22,.55),rgba(10,14,22,.8)),url("images/fond.jpg") center/cover no-repeat,var(--ink)}
.wrap{position:relative;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--sc);font-size:22px;letter-spacing:.06em;margin:0}
.brand small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.tabs{display:flex;gap:4px;background:var(--deep);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{background:none;border:0;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--mist);font-weight:600;font-size:13px}
.tabs button[aria-selected="true"]{background:var(--lake);color:var(--frost)}

/* status */
.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.turn{font-family:var(--display);font-size:18px}
.turn b{font-variant-numeric:tabular-nums}
.energy{display:flex;align-items:center;gap:8px;color:var(--mist);font-size:13px}
.hex{width:34px;height:38px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--warm);color:#1b1206;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.hex.spent{background:#3a3325;color:var(--warm)}
.endbtn{margin-left:auto;background:var(--me);color:#06121b;border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;letter-spacing:.02em}
.endbtn:disabled{background:var(--lake);color:var(--mist);cursor:default}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:5px;border-radius:10px;border:1px dashed transparent;min-height:calc(2 * (var(--mh)) + 14px);--mh:clamp(62px, 17vw, 96px);align-content:start}
.side.foe{background:rgba(154,140,208,.05);align-content:end}
.side.me{background:rgba(111,184,222,.05)}
.side.me.can{border-color:var(--me);background:rgba(111,184,222,.12);cursor:pointer}
.side.cap2{grid-template-rows:auto}
.slot{height:var(--mh);border-radius:6px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.04)}
.slot.x{background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 4px,transparent 4px 8px);border-color:transparent}

.mini{position:relative;height:var(--mh);border-radius:6px;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.12);padding:0;background:none;display:block;width:100%}
.mini .art{position:absolute;inset:0}
.mini .pw{position:absolute;right:3px;bottom:3px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:rgba(6,10,18,.85);font-family:var(--display);font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.mini .pw.up{color:#9fe0b0}.mini .pw.down{color:#f0a0a0}
.mini.staged{border:1px dashed var(--me);opacity:.8}
.mini.back .art{background:repeating-linear-gradient(135deg,#1c2238 0 6px,#161b2d 6px 12px)!important}
.mini.back::after{content:"";position:absolute;inset:30% 30%;border:1px solid var(--foe);transform:rotate(45deg);opacity:.6}
.mini.flip{animation:flip .45s ease}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:none}}

.loc{position:relative;border-radius:12px;padding:8px 8px 8px;min-height:104px;background:linear-gradient(180deg,var(--lh,#223350) 0%,#111a2b 100%);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:center;overflow:hidden}
.loc{background-size:cover;background-position:center}
.loc .nm,.loc .fx{text-shadow:0 1px 3px rgba(0,0,0,.9)}
.loc .fx{color:#c9d6e8}
.loc .nm{font-family:var(--display);font-size:clamp(12px,3.2vw,15px);line-height:1.15;text-wrap:balance}
.loc .fx{font-size:10.5px;line-height:1.3;color:var(--mist);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.loc .tot{position:absolute;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums;border:1px solid}
.loc .tot.f{top:-1px;border-color:rgba(154,140,208,.5);color:var(--foe);background:#151529;border-radius:0 0 14px 14px;height:22px;width:34px;border-top:0}
.loc .tot.m{bottom:-1px;border-color:rgba(111,184,222,.5);color:var(--me);background:#0f1d2b;border-radius:14px 14px 0 0;height:22px;width:34px;border-bottom:0}
.loc .tot.lead{color:#0a0e16;border-color:transparent}
.loc .tot.f.lead{background:var(--foe)}
.loc .tot.m.lead{background:var(--me)}
.loc .inner{padding-block:18px 18px;display:flex;flex-direction:column;gap:4px}
.loc.can{border-color:var(--me)}

/* info */
.info{min-height:62px;background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center}
.info .t{font-family:var(--display);font-size:16px}
.info .m{color:var(--mist);font-size:12.5px}
.info .chip{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid currentColor;margin-left:6px;vertical-align:2px}

/* hand */
.handwrap{overflow-x:auto;padding-bottom:4px}
.hand{display:flex;gap:8px;width:max-content;min-width:100%;padding:8px 2px 2px}
.hc{position:relative;width:88px;aspect-ratio:2/3;border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.14);cursor:pointer;padding:0;background:none;transition:transform .15s ease, box-shadow .15s ease;flex:none}
.hc .art{position:absolute;inset:0}
.hc.sel{transform:translateY(-8px);box-shadow:0 0 0 2px var(--me),0 10px 24px rgba(0,0,0,.5)}
.hc.no{opacity:.45}
.cost{position:absolute;left:4px;top:4px;width:24px;height:27px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--warm);color:#1b1206;display:grid;place-items:center;font-family:var(--display);font-size:14px;font-variant-numeric:tabular-nums}
.cost.cut{background:#9fe0b0}
.hc .pw,.full .pw{position:absolute;right:4px;bottom:4px;width:26px;height:26px;border-radius:50%;background:rgba(6,10,18,.88);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.hc .nm{position:absolute;left:0;right:0;bottom:0;padding:18px 32px 6px 6px;font-family:var(--display);font-size:11.5px;line-height:1.15;text-align:left;background:linear-gradient(transparent,rgba(6,10,18,.92) 55%)}

/* art placeholders */
.art{background-size:cover;background-position:center 20%}
.art.ph{background:
  radial-gradient(90% 55% at 50% 28%, color-mix(in oklab, var(--fc) 60%, transparent) 0%, transparent 70%),
  repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 7px),
  linear-gradient(180deg,#1b263a,#0b0f17)}
.art.ph::before{content:attr(data-mono);position:absolute;left:0;right:0;top:18%;text-align:center;font-family:var(--sc);font-size:var(--monosz,30px);color:color-mix(in oklab, var(--fc) 45%, white);opacity:.85}
.mini .art.ph{--monosz:20px}
.art.token{background:radial-gradient(circle at 50% 40%,rgba(120,180,230,.35),transparent 60%),linear-gradient(180deg,#16304a,#0b1624)!important}

.log{font-size:12px;color:var(--mist);display:flex;flex-direction:column;gap:2px;max-height:88px;overflow:auto;border-left:2px solid var(--line);padding-left:10px}
.log div:first-child{color:var(--frost)}

/* result */
.veil{position:fixed;inset:0;background:rgba(5,8,14,.78);display:grid;place-items:center;padding:16px;z-index:5}
.result{background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.result h2{font-family:var(--sc);font-size:30px;margin:0;letter-spacing:.05em;text-wrap:balance}
.result .rows{display:flex;flex-direction:column;gap:6px;text-align:left}
.result .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-block:6px;font-variant-numeric:tabular-nums}
.result .row span:last-child{font-family:var(--display)}
.primary{background:var(--me);color:#06121b;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;color:var(--mist)}

/* codex */
.sec h2{font-family:var(--sc);font-size:18px;letter-spacing:.05em;margin:6px 0 10px}
.sec p{color:var(--mist);max-width:62ch;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.full{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.14);max-width:100%}
.full .art{position:absolute;inset:0}
.full .art.ph{--monosz:48px}
.full .cost{width:30px;height:34px;font-size:17px;left:6px;top:6px}
.full .pw{width:32px;height:32px;font-size:18px;right:6px;top:6px;bottom:auto}
.full .band{position:absolute;left:0;right:0;bottom:0;padding:30px 10px 10px;background:linear-gradient(transparent,rgba(6,10,18,.94) 38%)}
.full .band .n{font-family:var(--display);font-size:16px;line-height:1.1}
.full .band .f{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.full .band .e{font-size:11.5px;line-height:1.35;color:#c8d4e6;margin-top:6px}
.full.drag{outline:2px dashed var(--me);outline-offset:2px}
.cardcell{display:flex;flex-direction:column;gap:6px}
.up{position:relative;font-size:12px;color:var(--mist);display:flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 8px;justify-content:center}
.up input{position:absolute;opacity:0;width:1px;height:1px}
.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.locard{border-radius:12px;padding:12px;padding-top:88px;border:1px solid var(--line);background-color:#111a2b;background-size:cover;background-position:center}
.locard .n,.locard .e{text-shadow:0 1px 3px rgba(0,0,0,.9)}
.locard .n{font-family:var(--display);font-size:17px}
.locard .e{color:#c8d4e6;font-size:13px;margin-top:4px}
.rules{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:18px;color:#c8d4e6;max-width:62ch}
pre{background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font-size:12px;color:#c8d4e6;margin:0}

/* top bar */
.chfchip{display:inline-flex;align-items:center;gap:6px;background:rgba(219,168,98,.12);border:1px solid rgba(219,168,98,.35);color:var(--warm);border-radius:999px;padding:5px 12px;font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chfchip small{font-family:var(--body);font-size:10px;letter-spacing:.14em}
.topright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{overflow-x:auto;max-width:100%}
.tabs button{white-space:nowrap}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--mist);cursor:pointer;font-weight:600;font-size:13px}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:center}
.who .eyebrow,.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mist)}
.pname{font-family:var(--sc);font-size:clamp(30px,8vw,44px);letter-spacing:.04em;margin:2px 0 6px;line-height:1.05;overflow-wrap:anywhere}
.namerow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.namerow input{flex:1 1 160px;min-width:0;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--frost);font:16px var(--body)}
.small{font-size:12.5px;padding:6px 12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.stat{background:rgba(17,24,39,.78);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px}
.stat .v{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mist)}
.stat.gold{border-color:rgba(219,168,98,.45)}
.stat.gold .v{color:var(--warm)}
.play{margin-top:16px;width:100%;background:var(--me);color:#06121b;border:0;border-radius:12px;padding:15px 18px;font:700 17px var(--body);letter-spacing:.04em;cursor:pointer}
.play:disabled{background:var(--lake);color:var(--mist);cursor:default}
.hint{color:var(--mist);font-size:12.5px;margin-top:8px}
.fan{position:relative;aspect-ratio:1.4/1;max-width:100%;width:100%;background:none;border:0;padding:0;cursor:pointer;display:block}
.fan .full{pointer-events:none}
.fanedit{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);z-index:4;background:var(--deep);border:1px solid var(--line);border-radius:999px;font-size:11px;padding:2px 10px;color:var(--mist);white-space:nowrap}
.langbtn{display:flex;height:32px;padding:3px;border-radius:999px;background:var(--deep);border:1px solid var(--line);cursor:pointer;flex:none;font:600 11px/1 inherit;letter-spacing:.06em}
.langbtn span{display:grid;place-items:center;padding:0 8px;border-radius:999px;color:var(--mist)}
.langbtn span.on{background:var(--lake);color:var(--frost)}
.helpbtn{width:32px;height:32px;border-radius:50%;background:var(--deep);border:1px solid var(--line);color:var(--mist);font-family:var(--display);font-size:17px;cursor:pointer;flex:none}
.helpbtn[aria-current]{border-color:var(--me);color:var(--frost)}
.fan .full{position:absolute;width:40%;top:6%;left:30%;box-shadow:0 14px 30px rgba(0,0,0,.55)}
.fan .full:nth-child(1){transform:rotate(-12deg) translateX(-38%);z-index:1}
.fan .full:nth-child(2){z-index:3;top:0}
.fan .full:nth-child(3){transform:rotate(12deg) translateX(38%);z-index:2}
.fan .full .band .e{display:none}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.idline{display:flex;align-items:center;gap:10px;width:100%;margin:4px 0 10px;padding:8px 12px;background:var(--deep);border:1px solid var(--line);border-radius:14px;color:var(--frost);cursor:pointer;text-align:left;font:inherit}
.idline .idname{font-family:var(--display);font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idline .idrank{display:flex;align-items:center;gap:6px;color:var(--mist);font-size:13px;white-space:nowrap}
.vitrinewrap{margin:6px 0 14px}
.vitrinewrap .fan{touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;max-width:520px;margin:0 auto}
.fan .fcard{position:absolute;width:40%;top:6%;left:30%;background:none;border:0;padding:0;cursor:pointer;transition:transform .25s ease}
.fan .fcard .full{position:relative;left:auto;top:auto;width:100%;box-shadow:0 14px 30px rgba(0,0,0,.55);transform:none}
.fan .fcard:nth-child(1){transform:rotate(-12deg) translateX(-38%);z-index:1}
.fan .fcard:nth-child(2){z-index:3;top:0;cursor:zoom-in}
.fan .fcard:nth-child(3){transform:rotate(12deg) translateX(38%);z-index:2}
.pick,.thumb{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.vfoot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vdots{display:flex;gap:7px}.vdots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s}.vdots i.on{background:var(--frost)}
.playhint{text-align:center;margin:6px 0 14px}
.modes{display:grid;gap:10px;margin-bottom:14px}
.navrow .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;overflow:visible}
.navrow .tabs button{padding:7px 1px;font-size:12px;letter-spacing:-.01em;text-align:center;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){ .navrow .tabs button{font-size:11px;letter-spacing:-.02em} }
.side.me .mini{border:2px solid #4f9dff}
.side.foe .mini{border:2px solid #e0605a}
.qcard{text-align:left;background:rgba(17,24,39,.78);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.qcard .t{font-family:var(--display);font-size:17px}
.qcard .m{color:var(--mist);font-size:12.5px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;color:var(--mist);font-size:12px}
.toggle{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--mist);cursor:pointer;font-size:12px}

/* deck */
.deckhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.count{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.count.ok{color:#9fe0b0}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.thumb{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.14);padding:0;background:none;cursor:pointer;display:block;width:100%}
.thumb .art{position:absolute;inset:0}
.thumb .art.ph{--monosz:22px}
.thumb .cost{width:20px;height:22px;font-size:12px;left:3px;top:3px}
.thumb .pw{position:absolute;right:3px;bottom:3px;min-width:20px;height:20px;border-radius:10px;background:rgba(6,10,18,.88);font-family:var(--display);font-size:12px;display:grid;place-items:center}
.thumb.empty{border:1px dashed var(--line);cursor:default;background:rgba(255,255,255,.02)}
.pick{position:relative;border:0;padding:0;background:none;cursor:pointer;display:block;width:100%;text-align:left;border-radius:12px}
.pick.in .full{box-shadow:0 0 0 2px var(--me)}
.pick .tag{position:absolute;top:8px;right:8px;z-index:2;background:var(--me);color:#06121b;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.pick.off{opacity:.55}
.full.locked .art{filter:grayscale(1) brightness(.35)}
.full .lock{position:absolute;inset:0;display:grid;place-items:center;z-index:2;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);text-align:center;padding:10px}

/* shop */
.shop{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px;align-items:center}
.pack{aspect-ratio:2/3;border-radius:16px;position:relative;overflow:hidden;border:1px solid rgba(219,168,98,.5);background:
  radial-gradient(80% 50% at 50% 30%,rgba(219,168,98,.28),transparent 70%),
  repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),
  linear-gradient(180deg,#1d2a44,#0c111c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;max-width:220px;width:100%;margin-inline:auto}
.pack .pt{font-family:var(--sc);font-size:24px;letter-spacing:.06em;text-wrap:balance}
.pack .ps{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--warm)}
.pack .diamond{width:44px;height:44px;border:1px solid var(--warm);transform:rotate(45deg);margin-bottom:10px;opacity:.8}
.pack.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
.price{font-family:var(--display);font-size:30px;color:var(--warm);font-variant-numeric:tabular-nums}
.buybox{display:flex;flex-direction:column;gap:10px}
.buybox .primary:disabled{background:var(--lake);color:var(--mist);cursor:default}
.odds{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;color:#c8d4e6;font-size:13px;font-variant-numeric:tabular-nums}
.odds span:nth-child(odd){color:var(--warm);font-family:var(--display);text-align:right}
.opened{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opened .cell{display:flex;flex-direction:column;gap:6px;align-items:center}
.opened .full{width:100%;animation:reveal .55s ease both}
.opened .cell:nth-child(2) .full{animation-delay:.35s}
.opened .cell:nth-child(3) .full{animation-delay:.7s}
@keyframes reveal{0%{transform:rotateY(90deg) scale(.9);opacity:.2}100%{transform:none;opacity:1}}
.badge{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.badge.new{background:#9fe0b0;color:#08170e}
.badge.dup{background:rgba(219,168,98,.16);color:var(--warm);border:1px solid rgba(219,168,98,.4)}
.progress{height:6px;border-radius:3px;background:var(--lake);overflow:hidden}
.progress i{display:block;height:100%;background:var(--warm)}
.reward{font-family:var(--display);font-size:22px;color:var(--warm)}
.row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row2 > *{flex:1 1 140px}

@media (max-width:560px){
  .brand{font-size:19px}
  .topright{gap:6px}
  .home,.shop{grid-template-columns:1fr}
  .home .fan{order:-1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pack{max-width:170px}
  .opened .full .band .e{display:none}
  .opened{gap:6px}
}
@media (prefers-reduced-motion: reduce){ .opened .full,.pack.shake{animation:none} }

/* nouveautés & holo */
.soonbar{position:relative;display:flex;gap:12px;align-items:flex-start;border:1px solid rgba(219,168,98,.45);border-radius:14px;padding:12px 44px 12px 14px;background:linear-gradient(135deg,rgba(219,168,98,.16),rgba(17,24,39,.85) 60%)}
.soonbar.live{border-color:rgba(242,198,255,.55);background:linear-gradient(135deg,rgba(242,198,255,.16),rgba(17,24,39,.85) 60%)}
.soonbar b{font-family:var(--display);font-size:18px;font-weight:400;display:block;margin:2px 0}
.soonbar .toggle{margin-top:8px}
/* ===== thèmes saisonniers ===== */
html[data-season="halloween"]{--warm:#ec8a3c;--me:#7cc4e4}
html[data-season="noel"],html[data-season="nouvelan"]{--warm:#e7c77e;--me:#8fd0f0}
html[data-season="halloween"] body::before{background:linear-gradient(180deg,rgba(14,10,22,.45),rgba(12,8,18,.82)),url("images/fond_halloween.jpg") center/cover no-repeat,var(--ink)}
html[data-season="noel"] body::before,html[data-season="nouvelan"] body::before{background:linear-gradient(180deg,rgba(8,14,24,.4),rgba(8,12,20,.8)),url("images/fond_noel.jpg") center/cover no-repeat,var(--ink)}
html[data-season] body::after{content:"";position:fixed;inset:-20% 0 0 0;z-index:-1;pointer-events:none;opacity:.55}
html[data-season="halloween"] body::after{background-image:radial-gradient(2px 2px at 12% 80%,#ff9b4a 60%,transparent),radial-gradient(1.5px 1.5px at 37% 60%,#ffb36b 60%,transparent),radial-gradient(2px 2px at 64% 90%,#ff8a3a 60%,transparent),radial-gradient(1.5px 1.5px at 85% 70%,#c98bff 60%,transparent),radial-gradient(2px 2px at 52% 40%,#ff9b4a 60%,transparent);background-size:340px 420px;animation:embers 18s linear infinite}
html[data-season="noel"] body::after,html[data-season="nouvelan"] body::after{background-image:radial-gradient(2.5px 2.5px at 10% 10%,#fff 60%,transparent),radial-gradient(1.8px 1.8px at 30% 45%,#e8f4ff 60%,transparent),radial-gradient(2.2px 2.2px at 58% 20%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 78% 62%,#dbeeff 60%,transparent),radial-gradient(2px 2px at 90% 30%,#fff 60%,transparent);background-size:300px 360px;animation:snow 22s linear infinite}
@keyframes embers{from{background-position:0 0}to{background-position:40px -840px}}
@keyframes snow{from{background-position:0 0}to{background-position:-60px 1080px}}
@media (prefers-reduced-motion: reduce){ html[data-season] body::after{animation:none} }
.seasonbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:14px;padding:12px 14px;margin-bottom:12px;border:1px solid rgba(236,138,60,.5);background:linear-gradient(135deg,rgba(236,138,60,.2),rgba(24,12,30,.85) 65%)}
.seasonbar.noel{border-color:rgba(190,225,255,.5);background:linear-gradient(135deg,rgba(190,225,255,.18),rgba(10,18,32,.85) 65%)}
.seasonbar b{font-family:var(--display);font-size:18px;font-weight:400;display:block;margin:2px 0}
.seasonbar .eyebrow{color:var(--warm)}
.seasonbar .primary{background:var(--warm);color:#1b1206}
.xbtn{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:none;border:1px solid var(--line);color:var(--mist);font-size:18px;cursor:pointer;line-height:1}
.full.soon .art{filter:grayscale(1) brightness(.12) blur(2px)}
.holo{position:relative}
.holo::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;
  background:linear-gradient(115deg,transparent 20%,rgba(255,120,220,.28) 32%,rgba(120,220,255,.28) 42%,rgba(255,240,140,.28) 52%,transparent 64%);
  background-size:250% 250%;mix-blend-mode:color-dodge;animation:holo 3.2s linear infinite}
.full.holo{box-shadow:0 0 0 2px #f2c6ff,0 0 22px rgba(242,198,255,.45)}
.hc.holo,.mini.holo{border-color:#f2c6ff}
@keyframes holo{0%{background-position:100% 0}100%{background-position:-100% 0}}
.ulpop{text-align:center}.ulcard{width:min(220px,70vw);margin-inline:auto}
@media (prefers-reduced-motion: reduce){ .holo::after{animation:none;background-position:50% 0} }
/* partie guidée, zoom, pack */
.tutbar{border:1px solid var(--warm);border-radius:12px;padding:10px 12px;background:rgba(219,168,98,.1)}
.tutbar p{margin:4px 0 0;font-size:13.5px}.tutbar .ok{color:#9fe0b0}
.hc.tutreq{box-shadow:0 0 0 2px var(--warm),0 0 16px rgba(219,168,98,.6);animation:pulse 1.6s ease-in-out infinite}
.dlt{position:absolute;left:3px;top:3px;font:700 10px var(--body);padding:1px 4px;border-radius:6px;background:rgba(6,10,18,.85);z-index:2}
.dlt.up{color:#9fe0b0}.dlt.down{color:#f0a0a0}
.full .pw.up{color:#9fe0b0}.full .pw.down{color:#f0a0a0}
.modlist{display:flex;flex-direction:column;gap:3px;margin:6px 0 10px;font-size:13px}
.modlist .up{color:#9fe0b0}.modlist .down{color:#f0a0a0}
.gzloc{width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
.gzimg{aspect-ratio:4/3;border-radius:14px;background-size:cover;background-position:center;border:1px solid var(--line)}
.mini,.hc,.loc{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.packveil{overflow:auto}
.packshow{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;max-height:94vh;overflow:auto;padding-block:8px}
.packshow h2{font-family:var(--sc);margin:0;letter-spacing:.05em}
.packburst{width:120px;aspect-ratio:2/3;border-radius:12px;background-size:cover;background-position:center;animation:burst .6s ease forwards}
@keyframes burst{0%{transform:scale(1)}60%{transform:scale(1.15) rotate(-3deg);opacity:1}100%{transform:scale(.4);opacity:0;height:0;margin:-7px 0}}
.packcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.packshow.many .packcards{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.pcell{display:flex;flex-direction:column;align-items:center;gap:6px}
.pcell .full{width:100%;animation:reveal .55s ease both;animation-delay:var(--d)}
.pcell .badge{animation:fadein .3s ease both;animation-delay:calc(var(--d) + .4s)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.packshow.many .full .band .e{display:none}
.packshow:not(.many) .packcards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media (prefers-reduced-motion: reduce){ .packburst,.pcell .full,.pcell .badge,.hc.tutreq{animation:none} }
/* vitrine */
.fangrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.fanopt{position:relative;background:none;border:0;padding:0;cursor:pointer;border-radius:8px}
.fanopt .thumb{pointer-events:none}
.fanopt.on .thumb{box-shadow:0 0 0 2px var(--warm)}
.fanopt:not(.on) .thumb{opacity:.75}
.fannum{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--warm);color:#1b1206;font-weight:700;font-size:12px;display:grid;place-items:center}
/* zoom */
.zoombtn{background:none;border:0;padding:0;cursor:zoom-in;display:block;width:100%;border-radius:12px}
.zoomwrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(360px,100%);max-height:94vh;overflow:auto}
.full.big{width:min(340px,82vw)}
.full.big .band .n{font-size:24px}
.full.big .band .e{font-size:14px}
.full.big .cost{width:44px;height:50px;font-size:24px}
.full.big .pw{width:46px;height:46px;font-size:24px}
.zoominfo{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.zoominfo .t{font-family:var(--display);font-size:20px}
.zoominfo .m{color:var(--mist);font-size:12.5px}
.zoominfo p{margin:8px 0 10px;color:#c8d4e6}
/* duel */
.packtile.done{opacity:.55}
.oathbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid rgba(219,168,98,.45);background:linear-gradient(135deg,rgba(219,168,98,.14),rgba(17,24,39,.85) 60%);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13px}
.oathbar.sworn{color:var(--warm);display:block}
.oathbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.oathchip{border-color:rgba(219,168,98,.55);color:var(--warm)}
.oathchip.on{background:rgba(219,168,98,.16)}
.loc.oath{box-shadow:0 0 0 2px var(--warm) inset}
.pilesbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:12px;color:var(--mist);margin:2px 0 6px}
.pilebtn{font:inherit;color:inherit;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:2px 9px;cursor:pointer}
.pilebtn:hover{border-color:rgba(255,255,255,.3)}
.pilepanel{width:min(460px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.pileside .m{margin-bottom:6px}
.pilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.loc.aioath{box-shadow:0 0 0 2px var(--ko) inset}
.loc.cross{box-shadow:0 0 0 2px var(--warm) inset,0 0 0 4px var(--ko) inset}
.oathres.kept{color:#9fe0b0}.oathres.broken{color:var(--ko)}
.stallgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stallgrid .cell{display:flex;flex-direction:column;gap:6px}
.stallgrid .primary{width:100%;font-size:12px;padding:8px 6px}
.stallgrid .primary:disabled{background:var(--lake);color:var(--mist)}
.stallgrid .full .band .e{display:none}
.hist .hrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hist .hrow:first-of-type{border-top:0}
.hmode{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--mist);min-width:52px;text-align:center}
.hmain{display:flex;flex-direction:column;min-width:0}
.hmain small{color:var(--mist);font-size:11.5px}
.hrow.win b{color:#9fe0b0}.hrow.lose b{color:var(--ko)}
.lb{display:flex;flex-direction:column;gap:6px}
.lbrow{display:flex;align-items:center;gap:10px;background:rgba(17,24,39,.78);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.lbrow.me{border-color:var(--warm)}
.lbn{font-family:var(--display);font-size:18px;width:22px;text-align:center;color:var(--warm)}
.lbmain{flex:1;min-width:0;display:flex;flex-direction:column}
.lbmain small{color:var(--mist);font-size:11.5px}
.lbon{font-style:normal;font-size:10px;color:#9fe0b0;letter-spacing:.06em}
.lb.old{opacity:.6}
.decktabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.decktab{position:relative;aspect-ratio:3/4;border-radius:12px;border:1px solid var(--line);background-size:cover;background-position:center;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:8px;text-align:left;overflow:hidden}
.decktab.on{border-color:var(--warm);box-shadow:0 0 0 2px var(--warm)}
.decktab .dn{font-family:var(--display);font-size:15px;line-height:1.1;overflow-wrap:anywhere}
.decktab .dc{font-size:10.5px;color:var(--mist);letter-spacing:.04em}
.deckedit{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.deckedit .namerow{flex:1 1 200px}
.bzcard{border-color:rgba(236,138,60,.5)!important;background:linear-gradient(135deg,rgba(236,138,60,.16),rgba(17,24,39,.85) 60%)!important;margin-bottom:10px}
.bzladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.bzstep{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:rgba(17,24,39,.78);display:flex;flex-direction:column;gap:2px}
.bzstep b{font-family:var(--display);font-size:18px;font-weight:400;color:var(--warm)}
.bzstep span{font-size:11px;color:var(--mist)}
.bzstep.on{border-color:var(--warm);background:rgba(219,168,98,.14)}
.bzopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.duelcard{width:100%;border-color:rgba(111,184,222,.45);background:linear-gradient(135deg,rgba(111,184,222,.14),rgba(17,24,39,.85) 60%)}
.mpbox{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.mpcode{font-family:var(--display);font-size:34px;letter-spacing:.14em;color:var(--warm)}
.mpjoin{display:flex;gap:8px;width:100%;flex-wrap:wrap}
.mpinput{flex:1 1 160px;min-width:0;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--frost);font:16px var(--display);letter-spacing:.1em;text-transform:uppercase}
.mpbar{display:flex;align-items:center;gap:10px;background:rgba(154,140,208,.1);border:1px solid rgba(154,140,208,.35);border-radius:10px;padding:6px 10px;font-size:13px;flex-wrap:wrap}

/* avatars & rangs */
.avatar{display:inline-grid;place-items:center;border-radius:50%;background:#1a2740 center/cover;border:2px solid rgba(219,168,98,.55);font-family:var(--sc);color:var(--warm);flex:none}
.avatar.sm{width:32px;height:32px;font-size:15px;border-width:1px}
.avatar.md{width:64px;height:64px;font-size:24px}
.avatar.lg{width:76px;height:76px;font-size:32px}
.avatar.locked{filter:grayscale(1) brightness(.3);border-color:var(--line)}
.rkicon{display:inline-block;flex:none;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}

.rkicon.md{width:56px;height:56px}
.rkrow{display:flex;align-items:center;gap:12px}
.idrow{display:flex;align-items:center;gap:14px}
.idtext{min-width:0}
.idrow + .namerow{margin-top:12px}
.avbtn{position:relative;background:none;border:0;padding:0;cursor:pointer;border-radius:50%}
.avedit{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--deep);border:1px solid var(--line);border-radius:999px;font-size:10px;padding:1px 7px;color:var(--mist);white-space:nowrap}

.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}

.avn{font-size:10.5px;line-height:1.2;text-align:center;color:#c8d4e6}
.rkstrip{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.rkstrip figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mist);width:64px;text-align:center}
.topright{align-items:center}
/* quêtes */
.quests{display:flex;flex-direction:column;gap:8px}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.qhead h2{font-family:var(--sc);font-size:18px;letter-spacing:.05em;margin:0}
.quest{background:rgba(17,24,39,.8);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}

.qr{color:var(--warm);font-family:var(--display);white-space:nowrap}

.packtile.hl{box-shadow:0 0 0 2px var(--warm),0 0 26px rgba(219,168,98,.35)}
.pbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.pname2{font-family:var(--display);font-size:19px;margin:0;line-height:1.15}
.pdesc{color:#c8d4e6;font-size:12.5px;margin:0}
.buyrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.buyrow .price{font-size:22px}
.buyrow .primary{padding:9px 14px}
.buyrow .primary:disabled{background:var(--lake);color:var(--mist);cursor:default}
.opened.many{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.opened .cell .full{animation-delay:var(--d)!important}
.tabs button.pulse{color:var(--warm);box-shadow:inset 0 0 0 1px var(--warm);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 1px var(--warm),0 0 14px rgba(219,168,98,.55)}}
.tuto{text-align:left;max-width:420px;max-height:90vh;overflow:auto}
.tuto h2{text-align:left;font-size:24px}
.tuto .tb{color:#c8d4e6;margin:0;line-height:1.55}
.tutocard{width:140px;margin-inline:auto}
.footbtns{display:flex;gap:6px;flex-wrap:wrap}
.art.token-img{background-size:cover;background-position:center 30%}

/* rang */
.rankcard{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid rgba(219,168,98,.35);background:linear-gradient(135deg,rgba(219,168,98,.12),rgba(17,24,39,.8) 60%)}
.rankcard .rk{font-family:var(--sc);font-size:24px;letter-spacing:.04em;line-height:1.15;margin:2px 0}
.rankcard .m{color:var(--mist);font-size:12px;margin-top:4px}
.stars{display:inline-flex;gap:3px;align-items:center;color:var(--mist);font-size:13px}
.star{font-style:normal;color:#3a4661;font-size:18px}
.star.on{color:var(--warm);text-shadow:0 0 8px rgba(219,168,98,.5)}
.rankline{font-size:14px;line-height:1.5}
.rankline span{color:var(--mist);font-size:12.5px}
/* factions, filtres, états */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chipbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--cc,var(--mist));cursor:pointer;font-size:12.5px;font-weight:600}
.chipbtn[aria-pressed="true"]{background:var(--lake);border-color:var(--cc,var(--frost));color:var(--cc,var(--frost))}
.notice{background:rgba(219,168,98,.1);border:1px solid rgba(219,168,98,.4);color:var(--warm);border-radius:12px;padding:10px 12px;font-size:13px}
.mini.neg{filter:grayscale(.85)}
.mini.neg::after{content:"∅";position:absolute;left:3px;bottom:2px;font-size:12px;color:#f0a0a0;text-shadow:0 1px 2px #000}
.loc.locked{border-color:#6a5a8a}
.loc .fx b{color:var(--warm);font-weight:600}
.full.legend{box-shadow:0 0 0 2px var(--warm),0 0 24px rgba(219,168,98,.45)}

@media (prefers-reduced-motion: reduce){ .mini.flip{animation:none} .hc{transition:none} }
@media (max-width:420px){ .hc{width:78px} .loc .fx{-webkit-line-clamp:2} }
/* menu à icônes : en bas sur téléphone, à gauche sur grand écran */
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icobtn{display:grid;place-items:center;position:relative}
.icobtn .ico{width:18px;height:18px}
.icobtn.dot::after{content:"";position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:var(--warm);box-shadow:0 0 0 2px var(--ink)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(10,14,22,.94);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;border-radius:12px;padding:5px 2px;color:var(--mist);cursor:pointer;font-size:11px;font-weight:600;min-width:0}
.dock button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock button[aria-current]{color:var(--frost);background:var(--lake)}
.dock button.pulse{color:var(--warm);box-shadow:inset 0 0 0 1px var(--warm);animation:pulse 1.6s ease-in-out infinite}
body.hasdock .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom))} /* le corps a une hauteur fixe : la marge va sur le contenu */
@media (min-width:900px){
  .dock{top:0;right:auto;width:104px;grid-template-columns:none;grid-auto-rows:min-content;align-content:center;gap:8px;border-top:0;border-right:1px solid var(--line);padding:12px 8px}
  .dock button{padding:10px 2px;font-size:11.5px}
  body.hasdock{padding-left:120px} body.hasdock .wrap{padding-bottom:24px}
}
@media (prefers-reduced-motion: reduce){ .dock button.pulse{animation:none} }
.sheet{width:min(460px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px;background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:16px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.setrow > span:first-child{color:var(--mist);font-size:13px}
.setacc{line-height:1.7}
.modes{grid-template-columns:repeat(2,minmax(0,1fr))}
.modes .qcard{padding:10px 12px}
.modes .qcard .t{font-size:16px}
.modes .qcard .m{font-size:12px}
.playhint.top{margin:-10px 0 -4px;text-align:center}
/* le premier écran tient sans défiler : la vitrine rétrécit sur les petits écrans */
.vitrinewrap .fan{max-width:min(520px,calc((100svh - 390px)*1.4))}


/* partie : tout tient sur un écran, le plateau suit la hauteur disponible */
body.inplay{padding-block:8px 16px}
body.inplay .wrap{gap:8px}
body.inplay .status{flex-wrap:nowrap;gap:10px}
body.inplay .side{--mh:clamp(44px,min(17vw,calc((100dvh - 500px)/4)),96px)}
body.inplay .loc{min-height:92px}
.subbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.subbar .pilesbar{margin:0}
@media (max-width:480px){ body.inplay .elab{display:none} body.inplay .endbtn{padding:10px 14px} }
@media (max-height:820px){ body.inplay .hc{width:68px} body.inplay .loc{min-height:84px} body.inplay .info{min-height:0;padding:7px 10px} body.inplay .info .t{font-size:15px} body.inplay .info .m{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden} }
.collbar{display:flex;flex-direction:column;gap:8px;background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.collbar .qt{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-size:17px}
.collbar .qt b{color:var(--warm);font-variant-numeric:tabular-nums}
.collbar .progress{height:10px;border-radius:5px}
/* accueil : la vitrine profite de toute la hauteur visible, l'espace restant se répartit autour d'elle */
body.hasdock .wrap{min-height:calc(100dvh - 36px);box-sizing:border-box}
.wrap > .vitrinewrap{margin-block:auto}
.vitrinewrap .fan{max-width:min(520px,calc((100dvh - 390px)*1.4))}

/* effets visuels */
.fxlayer{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:4}
.loc.fxshake{animation:fxshake .45s ease}
@keyframes fxshake{0%,100%{transform:none}20%{transform:translate(-3px,1px) rotate(-.6deg)}40%{transform:translate(3px,-1px) rotate(.6deg)}60%{transform:translate(-2px,0)}80%{transform:translate(2px,1px)}}
@media (prefers-reduced-motion: reduce){ .loc.fxshake{animation:none} }

/* cartes en grand : inclinaison, reflet, ambiance ; cadre des ultra-légendaires tracé à l'intérieur pour ne jamais être rogné */
.full.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;touch-action:pan-y}
.full.tilt::before{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:inherit;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.5),transparent 40%),linear-gradient(115deg,transparent 20%,rgba(255,180,90,.22) 40%,rgba(120,220,255,.22) 55%,transparent 75%);mix-blend-mode:color-dodge;opacity:calc(.12 + var(--glow,0) * .7);transition:opacity .3s}
.full .ambcv{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;mix-blend-mode:screen}
.full.holo{box-shadow:0 0 22px rgba(242,198,255,.45);outline:2px solid #f2c6ff;outline-offset:-2px}
.zoomwrap{padding:14px 10px}
@media (prefers-reduced-motion: reduce){ .full.tilt{transform:none;transition:none} }

/* Brillance par rareté : commune rien · rare halo bleu + reflet lent · épique halo violet qui pulse + reflet vif · légendaire halo doré + reflet + souffle dans l'illustration */
.full.r-R,.hc.r-R{outline:2px solid rgba(127,182,230,.95);outline-offset:-2px;box-shadow:0 0 14px rgba(127,182,230,.45)}
.full.r-E,.hc.r-E{outline:2px solid rgba(196,156,255,1);outline-offset:-2px;box-shadow:0 0 20px rgba(181,140,240,.6)}
.full.r-L,.hc.r-L{outline:2px solid rgba(255,205,110,1);outline-offset:-2px;box-shadow:0 0 22px rgba(255,205,110,.55)}
.mini.r-R{outline:2px solid rgba(127,182,230,.95);outline-offset:-4px}
.mini.r-E{outline:2px solid rgba(196,156,255,1);outline-offset:-4px}
.mini.r-L{outline:2px solid rgba(255,205,110,1);outline-offset:-4px}
/* halo intérieur, posé au-dessus de l'illustration : fixe pour le rare, pulsé pour l'épique */
.full.r-R::before,.full.r-E::before,.hc.r-R::after,.hc.r-E::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 18px 3px rgba(127,182,230,.5)}
.full.r-E::before,.hc.r-E::after{box-shadow:inset 0 0 26px 5px rgba(181,140,240,.75);animation:epulse 2.2s ease-in-out infinite alternate;will-change:opacity}
@keyframes epulse{from{opacity:.35}to{opacity:1}}
/* reflet qui balaie : lent et pâle pour le rare, vif et fréquent pour l'épique, doré pour la légendaire */
.full.r-R::after,.full.r-E::after,.full.r-L::after,.hc.r-R::before,.hc.r-E::before,.hc.r-L::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;
  background:linear-gradient(105deg,transparent 40%,rgba(160,205,245,.3) 50%,transparent 60%);transform:translateX(-120%);animation:rsweep 9s ease-in-out infinite;will-change:transform}
.full.r-E::after,.hc.r-E::before{background:linear-gradient(105deg,transparent 30%,rgba(205,175,255,.8) 50%,transparent 70%);animation-duration:3.4s}
.full.r-L::after,.hc.r-L::before{background:linear-gradient(105deg,transparent 34%,rgba(255,226,160,.7) 50%,transparent 66%);animation-duration:3.2s}
@keyframes rsweep{0%,52%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.hc.r-R::before,.hc.r-E::before,.hc.r-L::before,.hc.r-R::after,.hc.r-E::after{z-index:1}
.full.r-L:not(.locked) .art{animation:lbreath 10s ease-in-out infinite alternate;will-change:transform}
@keyframes lbreath{from{transform:scale(1) translateY(0)}to{transform:scale(1.045) translateY(-1.2%)}}
.full .lgp{position:absolute;left:0;right:0;top:0;height:200%;z-index:2;pointer-events:none;opacity:.75;will-change:transform;animation:lrise 14s linear infinite;
  background-size:100% 50%;background-image:radial-gradient(circle at 18% 22%,rgba(255,230,170,.95) 0 1px,transparent 2px),radial-gradient(circle at 63% 41%,rgba(255,230,170,.8) 0 1.2px,transparent 2.4px),radial-gradient(circle at 82% 12%,rgba(255,230,170,.9) 0 1px,transparent 2px),radial-gradient(circle at 36% 74%,rgba(255,230,170,.8) 0 1.2px,transparent 2.4px),radial-gradient(circle at 74% 88%,rgba(255,230,170,.9) 0 1px,transparent 2px)}
@keyframes lrise{from{transform:translateY(0)}to{transform:translateY(-50%)}}
/* Pour rester fluide sur téléphone : le plateau (miniatures) garde le liseré fixe ; dans les grilles, halo épique fixe, pas de reflet sur les rares, souffle des légendaires réservé au grand format */
.grid .full.r-L .art,.stallgrid .full.r-L .art{animation:none}
.grid .full.r-E::before,.stallgrid .full.r-E::before{animation:none;opacity:.8}
.grid .full.r-R::after,.stallgrid .full.r-R::after{display:none}
@media (prefers-reduced-motion: reduce){ .full.r-R::after,.full.r-E::after,.full.r-L::after,.hc.r-R::before,.hc.r-E::before,.hc.r-L::before{animation:none;transform:translateX(0);opacity:.25} .full.r-E::before,.hc.r-E::after,.full.r-L .art{animation:none} .full .lgp{display:none} }
.volrow{display:flex;align-items:center;gap:10px}.volrow input{width:130px;accent-color:var(--me)}.volrow b{min-width:28px;text-align:right;font-weight:600;color:var(--frost);font-variant-numeric:tabular-nums}
/* Cinématique de fusion (ultra-légendaires) */
.cine{position:fixed;inset:0;z-index:9000;background:rgba(4,8,16,.86);display:grid;place-items:center;overflow:hidden;touch-action:manipulation;cursor:pointer}
.cine .cc{position:absolute;width:min(34vw,150px);aspect-ratio:2/3;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.3);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.cine .cc .art{position:absolute;inset:0}
.cine .cc span{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 6px;font-family:var(--display);font-size:11px;text-align:center;background:linear-gradient(transparent,rgba(6,10,18,.92))}
.cine .res{position:absolute;width:min(56vw,250px);aspect-ratio:2/3;border-radius:14px;overflow:hidden;opacity:0;box-shadow:0 0 40px rgba(242,198,255,.55);outline:2px solid #f2c6ff;outline-offset:-2px}
.cine .res .art{position:absolute;inset:0}
.cine .res span{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 10px;font-family:var(--display);font-size:15px;text-align:center;background:linear-gradient(transparent,rgba(6,10,18,.94))}
.cine .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.fcine{position:fixed;inset:0;z-index:8999;cursor:pointer;background:transparent;touch-action:manipulation}
/* Cinématique de fin de partie : victoire (or, rayons, lieux gagnés en colonnes de lumière), défaite (écran qui se fige et se fissure, cendres), égalité (bleu et violet qui se heurtent) */
.endcine{position:fixed;inset:0;z-index:8998;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;transition:opacity .45s}
.endcine.out{opacity:0}
.endcine canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.endcine .ectx{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px;text-align:center;pointer-events:none}
.endcine h2{font-family:var(--sc);font-size:clamp(38px,11vw,82px);line-height:1;letter-spacing:.12em;margin:0;text-wrap:balance}
.endcine .ecsub{font-family:var(--sc);font-size:clamp(13px,3.6vw,17px);letter-spacing:.18em;color:#c9d6e8;opacity:0;animation:ecsub .6s ease-out both 1.1s}
.endcine.win h2{color:#fff4dc;text-shadow:0 0 14px rgba(255,210,120,.95),0 0 44px rgba(219,168,98,.7),0 2px 0 rgba(90,55,10,.6);animation:ecwin .85s cubic-bezier(.2,1.5,.4,1) both .3s}
.endcine.lose h2{color:#cbbad6;text-shadow:0 0 20px rgba(130,30,70,.85),0 2px 0 rgba(0,0,0,.7);animation:eclose 1.5s ease-out both .55s}
.endcine.draw h2{background:linear-gradient(90deg,var(--me),#e8e4f4 50%,var(--foe));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(200,200,255,.5));animation:ecdraw .8s ease-out both .75s}
@keyframes ecwin{0%{opacity:0;transform:scale(2.6);filter:blur(12px)}55%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none}}
@keyframes eclose{0%{opacity:0;transform:translateY(-22px);letter-spacing:.55em;filter:blur(8px)}70%{opacity:1}100%{opacity:1;transform:none;letter-spacing:.12em;filter:none}}
@keyframes ecdraw{0%{opacity:0;transform:scaleX(.2)}100%{opacity:1;transform:none}}
@keyframes ecsub{from{opacity:0;transform:translateY(6px)}to{opacity:.9;transform:none}}
body.ec-lose #app{filter:grayscale(.9) brightness(.62) contrast(1.1);transition:filter 1.4s ease-in}
body.ec-win #app{filter:brightness(.8) saturate(1.15);transition:filter .6s}
body.ec-draw #app{filter:brightness(.75);transition:filter .6s}
.loc.ecwon{animation:ecwon 1.1s ease-out both;z-index:2}
.loc.eclost{animation:eclost 1.3s ease-in both}
@keyframes ecwon{0%{box-shadow:none}35%{box-shadow:0 0 0 2px #ffe3a3,0 0 34px 6px rgba(255,205,110,.85);transform:scale(1.06)}100%{box-shadow:0 0 0 1px rgba(255,220,150,.7),0 0 18px 2px rgba(255,205,110,.45);transform:none}}
@keyframes eclost{0%{transform:none;opacity:1}20%{transform:translate(-2px,1px) rotate(-.8deg)}35%{transform:translate(2px,-1px) rotate(.8deg)}50%{transform:translate(-1px,0)}100%{transform:translateY(5px);opacity:.55}}
@media (prefers-reduced-motion: reduce){.endcine h2,.endcine .ecsub,.loc.ecwon,.loc.eclost{animation-duration:.01s}}
.fcount{position:fixed;z-index:9001;transform:translate(-50%,-100%);font-family:var(--display);font-size:26px;font-weight:700;color:#ffd78c;text-shadow:0 0 14px rgba(255,215,140,.85),0 2px 4px #000;pointer-events:none;transition:opacity .2s}
.cine .skip{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);opacity:.7;pointer-events:none}
</style>

function trUI(t){
  const U=window.HELVARA_UI_EN; if(LANG!=="en"||!U||!t) return t;
  const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(t), core=m[2].replace(/\s+/g," "); if(!core) return t;

  return r===undefined?t:(/^[:;,.!?]/.test(r)?"":m[1])+r+m[3]; /* pas d'espace avant la ponctuation en anglais */
}
function translateDOM(root){
  if(LANG!=="en") return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)?2:1});
  const nodes=[]; let n; while(n=w.nextNode()) nodes.push(n);
  for(const t of nodes){ const v=trUI(t.nodeValue); if(v!==t.nodeValue) t.nodeValue=v; }
  root.querySelectorAll("[aria-label],[placeholder],[title]").forEach(e=>{ for(const a of ["aria-label","placeholder","title"]){ const v=e.getAttribute(a); if(v){ const x=trUI(v); if(x!==v) e.setAttribute(a,x); } } });
}

   Chaque morceau est décodé une fois puis joué par Web Audio (AudioBufferSourceNode) : la boucle est sans coupure

   Fondus par GainNode (sur iPhone, audio.volume est ignoré). Sans Web Audio, repli sur un élément <audio>.

function flonHook(i,t){ if(locIs(i,"flon")){ t.pow+=2; (t.mods=t.mods||[]).push({v:2,src:"Le Flon"}); } }

const nm=c=>CARDS[c.id].name;

/* Dante : chaque carte détruite dans son lieu, des deux côtés, lui donne +1 */
function danteHook(li){ for(const side of ["p","e"]) for(const d of S.board[side][li]) if(live(d)&&d.id==="dante"){ d.pow+=1; (d.mods=d.mods||[]).push({v:1,src:"Dante"}); log(`Dante · +1 (${who(side)})`); } }
/* Médée : sa prochaine carte adverse jouée ici perd 2 (les deux suivantes avec Hécate) */

function reveal(s,li,c){
  const prevSrc=SRC; SRC={s,cost:CARDS[c.id].cost};
  try{ revealFx(s,li,c); } finally { SRC=prevSrc; }

/* Rejouer la Révélation d'une carte déjà posée (Aphrodite) : ni Brigid, ni effets de lieu à la pose */

    case "odin": { const t=S.hand[s].slice().sort((a,b)=>CARDS[b.id].cost-CARDS[a.id].cost)[0]; if(t) discard(s,t); draw(s); draw(s); note=t?`défausse ${nm(t)}, pioche 2`:"pioche 2"; break; }
    case "thor": { const sp=[0,1,2].filter(i=>i!==li&&!S.locs[i].locked&&S.board[s][i].length<capOf(s,i)); if(sp.length){ const i=gPick(sp); const m=mk("mjolnir"); m.rev=true; m.fresh=true; m.thor=c.uid; S.board[s][i].push(m); note=`Mjölnir → ${LOCS[S.locs[i].id].name}`; snd="destroy"; } break; }
    case "heimdall": { let n=0; const lk=[0,1,2].filter(i=>i!==li&&S.locs[i].locked);
      for(const t of mates.slice()){ const i=lk.find(i=>S.board[s][i].length<capOf(s,i)); if(i==null) break; S.board[s][li]=S.board[s][li].filter(x=>x!==t); S.board[s][i].push(t); flonHook(i,t); if(s==="p"&&qLive()) qProg("move2"); n++; }
      if(n){ note=`${n} carte${n>1?"s":""} passe${n>1?"nt":""} par le Bifröst`; snd="buff"; } else buffSelf(2); break; }
    case "hel": { const n=resurrectAll(s); if(n){ note=`ressuscite ${n} carte${n>1?"s":""}`; snd="void"; } break; }
    case "ulhel": { const n=resurrectAll(s,{ward:true}); if(n){ note=`ressuscite ${n} carte${n>1?"s":""}, intouchables`; snd="void"; } break; }
    case "hel_r": { const ids=S.discardPile[s].slice().sort((a,b)=>CARDS[b].cost-CARDS[a].cost); if(ids.length&&S.board[s][li].length<capOf(s,li)){ const r=resurrect(s,ids[0],li,"discard",{withReveal:true}); if(r){ note=`ressuscite ${nm(r)}`; snd="void"; } } break; }
    case "loviatar": { const id=S.discardPile[s][S.discardPile[s].length-1]; if(id){ const r=resurrect(s,id,li,"discard",{sick:2}); if(r){ note=`${nm(r)} revient malade (−2)`; snd="void"; } } break; }
    case "hades": { const ids=S.graveyard[s].slice().sort((a,b)=>CARDS[b].pow-CARDS[a].pow); if(ids.length){ const r=resurrect(s,ids[0],li,"grave"); if(r){ note=`ressuscite ${nm(r)}`; snd="void"; } } break; }
    case "dionysos": { const lost=[]; for(const side of [s,o]){ draw(side); const t=gPick(S.hand[side]); if(t){ discard(side,t); lost.push(nm(t)); } } note=lost.length?`l'ivresse fait défausser ${lost.join(" et ")}`:"pioche 1"; snd="void"; break; }
    case "poseidon": { let n=0; for(const t of targets.filter(x=>CARDS[x.id].cost<=3)){ S.board[o][li]=S.board[o][li].filter(x=>x!==t); if(!real(t)) continue; n++;
        if(S.hand[o].length<7) S.hand[o].push(mk(t.id)); else { S.discarded=(S.discarded||0)+1; S.discardPile[o].push(t.id); } }
      if(n){ note=`le reflux emporte ${n} carte${n>1?"s":""}`; snd="debuff"; } break; }
    case "circe": case "ulcirce": { let n=0; if(!shielded(o,li)) for(const t of targets) if(c.id==="ulcirce"||pw(o,li,t)<=3){ t.orig=t.id; t.id="pourceau"; t.pow=1; t.neg=true; t.mods=[]; n++; }
      if(n){ note=`${n} Pourceau${n>1?"x":""}`; snd="void"; } break; }
    case "qetesh": { const t=strongest(targets.filter(x=>pw(o,li,x)<=4&&!x.charm),o,li); if(t){ t.charm=s; note=`charme ${nm(t)}`; snd="void"; } break; }
    case "oshun": { let n=0; for(let i=0;i<3;i++) for(const x of S.board[s][i]) if(x!==c&&x.rev){ x.pow+=1; n++; } if(n){ note=`+1 à ${n} carte${n>1?"s":""}`; snd="buff"; } break; }
    case "scathach": { const sp=[0,1,2].filter(i=>i!==li&&!S.locs[i].locked&&S.board[o][i].length<capOf(o,i)); if(sp.length){ const i=gPick(sp); const m=mk("ombre"); m.rev=true; m.fresh=true; m.neg=true; S.board[o][i].push(m); note=`Ombre → ${LOCS[S.locs[i].id].name}`; snd="debuff"; } break; }
    case "uloshun": { const t=strongest(targets,o,li); if(t&&destroy(o,li,t)) note=`détruit ${nm(t)}`; let n=0; for(let i=0;i<3;i++){ const w=weakest(S.board[s][i].filter(x=>x.rev),s,i); if(w){ w.pow+=2; n++; } } note=(note?note+", ":"")+`+2 à ${n} carte${n>1?"s":""}`; snd="destroy"; break; }
    case "biblio": if(S.hand[s].length<S.hand[o].length){ draw(s); note="pioche 1 carte"; } break;
    case "ereshkigal": { const vs=forest(li)?[]:foes.filter(x=>pw(o,li,x)<=3); if(vs.length){ S.board[o][li]=S.board[o][li].filter(x=>!vs.includes(x)); S.destroyed+=vs.length; vs.forEach(x=>{ bury(o,x); danteHook(li); }); if(o==="e") S.killE=(S.killE||0)+vs.length; note=`détruit ${vs.length} carte${vs.length>1?"s":""}`; snd="destroy"; } break; }
    case "pele": { let n=0; for(const side of [s,o]) for(const x of S.board[side][li]) if(x!==c&&x.rev&&weaken(side,li,x,2)) n++; if(n){ note=`−2 à ${n} carte${n>1?"s":""}`; snd="destroy"; } break; }
    case "pele_r": { let n=0; for(let i=0;i<3;i++){ const t=strongest(S.board[o][i].filter(x=>x.rev&&!untargetable(s,o,x)),o,i); if(t&&weaken(o,i,t,2)) n++; } if(n){ note=`−2 à ${n} carte${n>1?"s":""}`; snd="destroy"; } break; }
    case "ulpele_r": { let n=0; for(let i=0;i<3;i++) for(const x of S.board[o][i]) if(x.rev&&!untargetable(s,o,x)&&weaken(o,i,x,1)) n++; if(n){ note=`−1 à ${n} carte${n>1?"s":""}`; snd="destroy"; } break; }
    case "qetesh_r": { const t=strongest(targets.filter(x=>pw(o,li,x)<=5&&!x.charm),o,li); if(t){ t.charm=s; note=`charme ${nm(t)}`; } let n=0; for(const x of mates){ x.pow+=1; n++; } if(n) note=(note?note+", ":"")+`+1 à ${n} carte${n>1?"s":""}`; if(note) snd="void"; break; }
    case "ulqetjor_r": { let n=0; for(let i=0;i<3;i++){ const t=strongest(S.board[o][i].filter(x=>x.rev&&!x.charm&&!untargetable(s,o,x)&&pw(o,i,x)<=3),o,i); if(t){ t.charm=s; n++; } } if(n){ note=`charme ${n} carte${n>1?"s":""}`; snd="void"; } break; }
    case "ares": { let n=0; for(const x of targets) if(weaken(o,li,x,1)) n++; if(n){ c.pow+=n; note=`−1 à ${n}, +${n}`; snd="debuff"; } break; }
    case "nergal": { let n=0; for(let i=0;i<3;i++) for(const x of S.board[o][i]) if(x.rev&&!untargetable(s,o,x)&&weaken(o,i,x,1)) n++; if(n){ note=`−1 à ${n} carte${n>1?"s":""}`; snd="debuff"; } break; }
    case "rusalka": { const t=weakest(targets,o,li); if(t&&pw(o,li,t)<=2&&destroy(o,li,t)){ note=`détruit ${nm(t)}`; snd="destroy"; } break; }
    case "mere": { let n=0; for(let i=0;i<3;i++) if(i!==li&&!S.locs[i].locked&&S.board[s][i].length<capOf(s,i)){ const t=mk("cendreux"); t.rev=true; t.fresh=true; S.board[s][i].push(t); n++; } if(n) note=`${n} Cendreux`; break; }
    case "nuee": { const t=strongest(mates,s,li); if(t){ const v=pw(s,li,t); if(v>c.pow){ c.pow=v; note=`reflète ${v}`; snd="buff"; } } break; }
    case "charognard": if(S.destroyed+(S.discarded||0)>0) buffSelf(3); break;
    case "ficelle": { let n=0; for(const x of mates) if(destroy(s,li,x)) n++; if(n){ c.pow+=3*n; note=`détruit ${n} carte${n>1?"s":""}, +${3*n}`; snd="destroy"; } break; }
    case "ecorche": { const t=gPick(targets); if(t&&weaken(o,li,t,2)){ note=`−2 à ${nm(t)}`; snd="debuff"; } break; }
    case "ulya": { const n=S.hand[s].length; if(n) buffSelf(n); break; }
    case "jordan": { const y=S.deck[s].find(x=>x.id==="yarden"); if(y&&S.hand[s].length<7){ S.deck[s]=S.deck[s].filter(x=>x!==y); S.hand[s].push(y); note="ajoute Yarden Weiss à sa main"; snd="buff"; } break; }
    case "morrigan_h": { draw(s); draw(s); const h2=S.hand[s].slice().sort((a,b)=>CARDS[b.id].cost-CARDS[a.id].cost)[0]; if(h2){ discard(s,h2); note=`pioche 2, défausse ${nm(h2)}`; } else note="pioche 2"; break; }
    case "nyx_h": { let n=0; for(let k=0;k<2;k++){ const t=weakest(S.board[o][li].filter(x=>x.rev&&!untargetable(s,o,x)),o,li); if(t&&destroy(o,li,t)) n++; else break; } if(n){ note=`détruit ${n} carte${n>1?"s":""}`; snd="destroy"; } break; }
    case "izzy_h": { const t=strongest(targets.filter(x=>pw(o,li,x)<=6),o,li); if(t){ const v=Math.ceil(Math.max(0,pw(o,li,t))/2); if(destroy(o,li,t)){ c.pow+=v; note=`détruit ${nm(t)}, +${v}`; snd="destroy"; } } break; }
    case "yarden_d": { let y=null, yl=-1; for(let i=0;i<3;i++){ const f=S.board[s][i].find(x=>x.rev&&x.id==="yarden"); if(f){ y=f; yl=i; break; } } if(y){ const v=Math.max(0,cardPow(s,yl,y)); if(destroy(s,yl,y)){ c.pow+=v; note=`absorbe Yarden Weiss, +${v}`; snd="void"; } } break; }
    case "ulji": { const hd=S.hand[o].slice().sort((a,b)=>CARDS[b.id].pow-CARDS[a.id].pow||CARDS[b.id].cost-CARDS[a.id].cost)[0];
      if(hd){ S.hand[o]=S.hand[o].filter(x=>x!==hd); let dest=S.board[s][li].length<capOf(s,li)?li:null; if(dest==null){ const sp=[0,1,2].filter(i=>S.board[s][i].length<capOf(s,i)); if(sp.length) dest=gPick(sp); }
        if(dest!=null){ hd.rev=true; hd.fresh=true; S.board[s][dest].push(hd); note=`invoque ${nm(hd)}${dest!==li?` (${LOCS[S.locs[dest].id].name})`:""}`; snd="void"; }
        else { S.discarded=(S.discarded||0)+1; piles(); S.discardPile[o].push(hd.id); note=`${nm(hd)} est défaussée, plus de place`; } } break; }
    case "kitsune": { const spots=[0,1,2].filter(i=>i!==li&&!S.locs[i].locked&&S.board[s][i].length<capOf(s,i));
      if(spots.length){ const i=gPick(spots); const t=mk("illusion"); t.rev=true; t.fresh=true; S.board[s][i].push(t); note=`Illusion → ${LOCS[S.locs[i].id].name}`; } break; }
    case "freyr": S.bonus[s]+=1; note="+1 énergie au prochain tour"; break;
    case "maeve": if(total(s,li)>total(o,li)) buffSelf(3); break;
    case "izzy": { const t=strongest(foes,o,li); if(t){ const v=Math.min(6,pw(o,li,t)); if(v>c.pow){ c.pow=v; note=`copie ${v}`; snd="buff"; } } break; }
    case "araignee": { let n=0; for(const t of foes) if(weaken(o,li,t,1)) n++; if(n){ note=`−1 à ${n} carte${n>1?"s":""}`; snd="debuff"; } break; }
    case "anat": { const t=weakest(mates,s,li); if(t){ const v=pw(s,li,t); if(destroy(s,li,t)){ c.pow+=v; note=`détruit ${nm(t)} (+${v})`; snd="destroy"; } } break; }
    case "bastet": { mates.forEach(x=>x.pow+=2); if(mates.length){ note=`+2 à ${mates.length} carte${mates.length>1?"s":""}`; snd="buff"; } break; }
    case "artemis": { const t=weakest(targets,o,li); if(t&&weaken(o,li,t,2)){ note=`−2 à ${nm(t)}`; snd="debuff"; } if(onSide(s,"izzy")||onSide(s,"izzy_h")) buffSelf(2); break; }
    case "eos": case "eos_r": { const n=onSide(s,"persephone")?2:1; for(let i=0;i<n;i++) draw(s); note=`pioche ${n} carte${n>1?"s":""}`; if(c.id==="eos_r"){ S.disc[s]=Math.max(S.disc[s],1); note+=", prochaine carte −1"; } break; }
    case "thot": { const t=strongest(targets,o,li); if(t&&weaken(o,li,t,2)){ note=`−2 à ${nm(t)}`; snd="debuff"; } break; }
    case "persephone": if(S.locs[li].rev&&!S.locs[li].stopped){ S.locs[li].stopped=true; note="l'effet du lieu s'arrête"; snd="lock"; } break;
    case "skadi": { const pool=[]; for(let i=0;i<3;i++) if(i!==li) for(const x of S.board[o][i]) if(x.rev&&!untargetable(s,o,x)&&!shielded(o,i)) pool.push([i,x]);
      if(pool.length){ const [i,t]=gPick(pool); weaken(o,i,t,3); note=`−3 à ${nm(t)} (${LOCS[S.locs[i].id].name})`; snd="debuff"; } break; }
    case "ixchel": { let best=null; for(let i=0;i<3;i++) for(const x of S.board[o][i]) if(x.rev&&!untargetable(s,o,x)&&!shielded(o,i)&&(!best||pw(o,i,x)>pw(o,best[0],best[1]))) best=[i,x];
      if(best){ weaken(o,best[0],best[1],3); note=`−3 à ${nm(best[1])}`; snd="debuff"; } break; }
    case "inanna": { for(const side of [s,o]) for(const x of S.board[side][li]) if(x.rev){ const base=CARDS[x.id].pow; if(base<x.pow&&shielded(side,li)) continue; x.pow=base; }
      note="tout revient à la base"; snd="lock"; break; }
    case "oya": { const t=strongest(targets.filter(()=>!shielded(o,li)),o,li); if(t){ t.pow=1; t.neg=true; t.mods=[{v:1-CARDS[t.id].pow,src:d.name}]; t.reset=true; note=`${nm(t)} devient une carte de puissance 1`; snd="debuff"; } break; }
    case "sekhmet": { let n=0; for(const side of [s,o]) for(const x of S.board[side][li].slice()) if(x!==c&&x.rev&&pw(side,li,x)<=2&&!(side===o&&untargetable(s,o,x))){ if(destroy(side,li,x)) n++; }
      if(n){ note=`détruit ${n} carte${n>1?"s":""}`; snd="destroy"; } break; }
  }
  sfx(snd);
  log(`${who(s)} · ${d.name} → ${LOCS[S.locs[li].id].name}${note?` (${note})`:""}`);
  if(opts.replay) return;
  if(locIs(li,"ouchy") && !S.first[s][li]){
    S.first[s][li]=1;
    if(S.board[s][li].length<capOf(s,li)){ const r=mk("reflet"); r.rev=true; r.fresh=true; S.board[s][li].push(r); log(`Lac Ouchy · un Reflet apparaît (${who(s)})`); }
  }
  if(locIs(li,"archives")) draw(s);
}

/* ======= IA ======= */
const HITS=["bia","circe","ulcirce","qetesh","qetesh_r","pele_r","ulpele_r","ulqetjor_r","poseidon","uloshun","tyr","medee_h","mohini","thot","esquille","izzy","artemis","oya","nyx","hathor","ishtar","araignee","apsu","balor","calypso","chasseur","maree","set","andraste","ulnem"];
const DESTROYERS=new Set(["anat","anubis","boucher","durga","ereshkigal","esquille","ficelle","izzy_h","lilith","maree","nergal_h","nyx","nyx_h","rusalka","sekhmet","sekhmet_n","troll","ulnem","uloshun","yarden_d"]);
const NEEDS_MATES=["susanoo","ulaph","oshun","tatoueur","comptable","bastet","anat","troll","tefnut"];
/* Synergies connues de l'IA : [carte qui prépare, cartes qui en profitent, 1 si elles doivent partager le lieu] */
const AI_PAIRS=[["yarden",["apsu","apsu_n","yarden_d"]],["freyr",["freya"],1],["freya",["freyr"],1],["ereshkigal",["nergal"]],["amaterasu",["susanoo"]],["izzy",["artemis"]],
  ["thot",["costumes"]],["persephone",["eos","eos_r"]],["hecate",["medee","medee_h"]],["styx",["nike","bia"]],["promethee",["pandore"]]];
const AI_PREP={}, AI_PAY={};
for(const [a,bs,loc] of AI_PAIRS){ (AI_PREP[a]=AI_PREP[a]||[]).push(...bs); for(const x of bs) (AI_PAY[x]=AI_PAY[x]||[]).push({a,loc:!!loc}); }
/* Cartes adverses qui visent la plus forte : l'IA évite alors de tout miser sur une seule grosse carte */
const AI_WARY=new Set(["nyx","nyx_h","durga","oya","ixchel","lilith","anubis","izzy_h","uloshun","ulnem","qetesh","qetesh_r","mohini","thot","medee_h"]);
/* L'IA compare toutes les combinaisons de sa main qui tiennent dans son énergie (128 au plus). Pour chacune, elle estime
   la puissance ajoutée dans chaque lieu, puis sa probabilité de gagner 2 lieux sur 3 face à ce que l'adversaire peut encore poser.
   me : côté joué ("e" par défaut, "p" pour les tests IA contre IA). Le bruit par palier brouille l'estimation des bas rangs. */
function aiPlan(me="e",tierOv){
  if(S.tut&&me==="e"){ return (TUT.plays[S.turn]||[]).map(([id,li])=>({c:S.hand.e.find(x=>x.id===id),li})).filter(x=>x.c); }
  const op=opp(me), t=tierOv!=null?tierOv:(S.aiTier||0), noise=[3,2.4,1.8,1.4,1,.6,.3][t];
  const en0=me==="e"?S.energyE:S.energy, hand=S.hand[me].slice(0,7);
  if(!hand.length) return [];
  const me0=[0,1,2].map(li=>total(me,li)), op0=[0,1,2].map(li=>total(op,li)), diffs=[0,1,2].map(li=>op0[li]-me0[li]);
  const foesN=[0,1,2].map(li=>S.board[op][li].filter(x=>x.rev).length), matesN=[0,1,2].map(li=>S.board[me][li].filter(x=>x.rev).length);
  const NZ=new Map(hand.map(c=>[c,[0,1,2].map(()=>(Math.random()*2-1)*noise)]));
  const onBoard=id=>S.board[me].some(col=>col.some(x=>x.rev&&x.id===id));
  piles();
  const seen=[...S.board[op].flat().filter(x=>x.rev).map(x=>x.id),...S.graveyard[op],...S.discardPile[op]];
  const wary=t>=2&&(seen.some(id=>AI_WARY.has(id))||(S.turn>=5&&S.hand[op].length>=4));
  /* ce que chaque camp peut encore ajouter : ce tour-ci pour l'adversaire, les tours suivants pour les deux */
  const open=s=>[0,1,2].map(li=>!S.locs[li].locked&&S.board[s][li].length<capOf(s,li));
  const share=(s,from)=>{ const o=open(s), n=o.filter(Boolean).length||1; let e=0; for(let k=from;k<=6;k++) e+=k*.8; return o.map(x=>x?e/n:0); };
  const opFut=share(op,S.turn), meFut=share(me,S.turn+1), sd=3+2.2*(6-S.turn);
  /* une carte posée dans un lieu : coût, puissance estimée, puissance retirée à l'adversaire, petits ajustements */
  const place=(c,li,ctx)=>{
    const d=CARDS[c.id];
    if(S.locs[li].locked||muted(me,li)||S.board[me][li].length+ctx.pend[li]>=capOf(me,li)) return null;
    const cost=costOf(me,c,li,ctx.first); if(cost>ctx.en) return null;
    const diff=diffs[li], foes=foesN[li], mates=matesN[li]+ctx.pend[li];
    let pow=d.pow+NZ.get(c)[li], hit=0, adj=0;
    if(locIs(li,"tour")&&d.pow>=5) pow+=2;
    if(locIs(li,"encheres")) pow+=2;
    if(locIs(li,"escaliers")&&d.fac==="helvara") pow+=2;
    if(locIs(li,"domaine")&&JPARTNERS.has(c.id)) pow+=2;
    if(HITS.includes(c.id)){ if(foes) hit+=2.5; else adj-=1; }
    if(NEEDS_MATES.includes(c.id)) pow+=mates?2:-1;
    if(c.id==="aphrodite") pow+=S.board[me][li].some(x=>replayable(x)&&CARDS[x.id].fac==="desir")?3:-2;
    if(c.id==="messagere"&&diff>0) pow+=3;
    if(locIs(li,"cirque")&&S.turn<4) pow+=d.pow<=2?2:-2;
    if(locIs(li,"sauvabelin")&&DESTROYERS.has(c.id)) adj-=4;
    if((c.id==="hermes"||c.id==="susanoo")&&[0,1,2].some(i=>i!==li&&locIs(i,"flon"))) pow+=1;
    if(c.id==="vritra") adj+=diff<0?4:-2;
    if(c.id==="maeve"&&diff<0) pow+=3;
    if(c.id==="morrigan"&&Math.abs(diff)<=2) adj+=2;
    if(c.id==="sekhmet"){ hit+=S.board[op][li].filter(x=>x.rev&&cardPow(op,li,x)<=2).reduce((a,x)=>a+cardPow(op,li,x),0); pow-=S.board[me][li].filter(x=>x.rev&&cardPow(me,li,x)<=2).reduce((a,x)=>a+cardPow(me,li,x),0); }
    /* synergies : la carte qui en profite vaut plus si sa préparatrice est déjà là (ou posée avant elle ce tour) */
    for(const p of (AI_PAY[c.id]||[])){ const ready=p.loc?(S.board[me][li].some(x=>x.id===p.a)||ctx.plays.some(x=>x.c.id===p.a&&x.li===li)):(onBoard(p.a)||ctx.plays.some(x=>x.c.id===p.a)); if(ready) pow+=3; }
    if(AI_PREP[c.id]&&hand.some(x=>AI_PREP[c.id].includes(x.id))) adj+=1.5;
    if(c.id==="brigid"&&hand.some(x=>x!==c&&CARDS[x.id].pow>=5)) adj+=1.5;
    if(locIs(li,"faille")&&S.turn<=4&&d.pow<=2) pow-=d.pow;
    if(c.id==="nemesis") adj+=(diff>0&&diff<12)?5:-6;
    if(c.id==="mouche") pow-=mates;
    if(c.id==="nike") pow+=ctx.plays.length*2;
    if(c.id==="pandore") pow+=Math.max(0,ctx.en-cost);
    if(wary&&d.pow>=6&&!S.board[me][li].length&&!ctx.pend[li]) adj-=1.5;
    return {cost,pow,hit,adj};
  };
  /* ordre de pose : les préparatrices d'abord, Pandore et Nike en dernier, puis les plus chères */
  const late=c=>c.id==="nike"||c.id==="pandore"?1:0, prepFor=(c,cs)=>(AI_PAY[c.id]||[]).some(p=>cs.some(x=>x.id===p.a))?1:0;
  const order=cs=>cs.slice().sort((a,b)=>late(a)-late(b)||prepFor(a,cs)-prepFor(b,cs)||CARDS[b.id].cost-CARDS[a.id].cost);
  const winP=(add,hit)=>{ const p=[0,1,2].map(li=>{ let m=me0[li]+add[li]+meFut[li]-(op0[li]-hit[li]+opFut[li]); if(nemInv(li)) m=-m; return 1/(1+Math.exp(-1.6*m/sd)); });
    return p[0]*p[1]+p[0]*p[2]+p[1]*p[2]-2*p[0]*p[1]*p[2]; };
  /* simulation exacte d'un plan sur une copie de la partie (Révélations comprises), sans son ni journal visibles */
  const sim=plays=>{ const keep=S, kq=quiet; let out=null;
    try{ quiet=true; S=structuredClone(keep);
      for(const {c,li} of plays){ const x=S.hand[me].find(y=>y.uid===c.uid); if(!x) continue; S.hand[me]=S.hand[me].filter(y=>y!==x); S.board[me][li].push(x); reveal(me,li,x); }
      out={m:[0,1,2].map(li=>total(me,li)),o:[0,1,2].map(li=>total(op,li)),inv:[0,1,2].map(li=>nemInv(li))};
    }catch(e){ out=null; } finally{ S=keep; quiet=kq; }
    return out; };
  const exactP=r=>{ const p=[0,1,2].map(li=>{ let m=r.m[li]+meFut[li]-(r.o[li]+opFut[li]); if(r.inv[li]) m=-m; return 1/(1+Math.exp(-1.6*m/sd)); });
    return p[0]*p[1]+p[0]*p[2]+p[1]*p[2]-2*p[0]*p[1]*p[2]; };
  const cands=[];
  for(let mask=0;mask<(1<<hand.length);mask++){
    const cs=order(hand.filter((_,i)=>mask>>i&1)), ctx={en:en0,first:true,plays:[],pend:[0,0,0]}, add=[0,0,0], hit=[0,0,0]; let adj=0, ok=true;
    for(const c of cs){ let bp=null;
      /* chaque carte va là où elle fait le plus monter la probabilité de victoire */
      for(let li=0;li<3;li++){ const r=place(c,li,ctx); if(!r) continue; add[li]+=r.pow; hit[li]+=r.hit; const v=winP(add,hit)*100+r.adj; add[li]-=r.pow; hit[li]-=r.hit; if(!bp||v>bp.v) bp={...r,li,v}; }
      if(!bp){ ok=false; break; }
      ctx.plays.push({c,li:bp.li}); ctx.en-=bp.cost; ctx.pend[bp.li]++; ctx.first=false; add[bp.li]+=bp.pow; hit[bp.li]+=bp.hit; adj+=bp.adj; }
    if(!ok) continue;
    let bonus=adj;
    /* garder une carte pour plus tard : bonus aux tours 2 à 5 si elle attend sa préparation ou le tour 6 */
    const kept=hand.filter(c=>!cs.includes(c));
    if(S.turn>=2&&S.turn<=5&&kept.some(k=>(AI_PAY[k.id]||[]).some(p=>onBoard(p.a)||ctx.plays.some(x=>x.c.id===p.a))||(CARDS[k.id].cost>=6&&S.turn===5))) bonus+=3;
    cands.push({plays:ctx.plays,bonus,est:winP(add,hit)*100+bonus});
  }
  /* les meilleures estimations sont rejouées pour de vrai sur une copie : le choix final se fait sur le résultat exact */
  cands.sort((a,b)=>b.est-a.est);
  let best=cands[0]||{plays:[]}, bv=-1e9;
  for(const c of cands.slice(0,t>=4?40:t>=2?12:0)){ const r=sim(c.plays); const v=r?exactP(r)*100+c.bonus+(Math.random()*2-1)*noise*3:c.est; if(v>bv){ bv=v; best=c; } }
  return best.plays;
}

function loseStar(){ if(P.st>0) P.st--; else if(P.lv<MAXLV&&!isFloor(P.lv)){ P.lv--; P.st=maxSt(P.lv)-1; } }
function applyRank(res,oath,cross){
  const before=P.lv; let bonus=0;
  if(res==="win"){ P.streak++; bonus=(P.streak>=2&&P.lv<12)?1:0;
    /* Serment croisé : +4 étoiles plafonnées (série comprise) si tenu, aucune si rompu */
    /* Serment tenu : +2 fixe, série ou pas. Serment croisé : +4 si tenu, 0 sinon. */
    const n=cross?(oath==="kept"?4:0):oath==="kept"?2:1+bonus;
    for(let i=0;i<n;i++){ P.st++; if(P.lv<MAXLV&&P.st>maxSt(P.lv)){ P.lv++; P.st=1; } } }
  else if(res==="lose"){ P.streak=0;
    /* Serment croisé : lieu tenu, la défaite ne coûte rien ; lieu perdu, −4 étoiles (jamais sous le plancher du palier) */
    if(cross){ if(oath==="broken") for(let i=0;i<4;i++) loseStar(); }
    else if(tierOf(P.lv)<2){} else loseStar(); }
  else P.streak=0;
  if(oath==="broken"&&!cross) loseStar();
  P.best=Math.max(P.best,P.lv);
  return {up:P.lv>before, down:P.lv<before, bonus, res, oath, cross:!!cross};
}

}

function rollRarity(odds){ let x=Math.random()*100; for(const [r,w] of odds){ if(x<w) return r; x-=w; } return odds[0][0]; }
function starterRoll(){
  const pool=PACK().filter(id=>CARDS[id].r!=="L");
  for(let t=0;t<500;t++){
    const ep=shuffle(pool.filter(id=>CARDS[id].r==="E")).slice(0,2);
    const rest=shuffle(pool.filter(id=>CARDS[id].r!=="E")).slice(0,10);
    const d=[...ep,...rest], cheap=d.filter(id=>CARDS[id].cost<=2).length, big=d.filter(id=>CARDS[id].cost>=5).length;
    if(cheap>=4&&big>=2&&big<=4) return d;
  }
  return [...STARTER];
}
function buyPack(pid){
  const pk=PACKS.find(x=>x.id===pid); if(pk&&!pk.starter&&!PACK(pk.id).some(id=>!P.owned.includes(id)&&pk.odds.some(o=>o[0]===CARDS[id].r))) return;
  if(!pk||P.chf<pk.price||(pk.starter&&P.starter)||!inWin(pk.win)||(!pk.starter&&!P.starter)) return;
  P.chf-=pk.price;
  let got;
  if(pk.starter){ got=starterRoll(); P.starter=true; hlStarter=false; }
  else {
    const allowed=pk.odds.map(o=>o[0]);
    got=[]; for(let i=0;i<pk.n;i++){ const r=rollRarity(pk.odds); got.push(pickRand(PACK(pk.id).filter(id=>CARDS[id].r===r))); }
    const missing=PACK(pk.id).filter(id=>!P.owned.includes(id)&&allowed.includes(CARDS[id].r));
    const exc=PACK(pk.id).filter(id=>CARDS[id].ex===pk.id&&!P.owned.includes(id)); if(exc.length&&!got.some(id=>CARDS[id].ex===pk.id)) got[2]=pickRand(exc);
    if(missing.length && !got.some(id=>missing.includes(id))){
      const r=rollRarity(pk.odds); const m=missing.filter(id=>CARDS[id].r===r);
      got[0]=pickRand(m.length?m:missing);
    }
  }
  const res=[]; let refund=0; const seen=new Set();
  for(const id of got){
    if(P.owned.includes(id)||seen.has(id)){ const v=ECO.dup[CARDS[id].r]||10; refund+=v; res.push({id,isNew:false,v}); }
    else { P.owned.push(id); seen.add(id); res.push({id,isNew:true}); }
  }
  if(pk.starter && P.deck.length<ECO.deckSize){ const pick=[...new Set([...P.deck,...got])].filter(id=>P.owned.includes(id)); P.deck=pick.slice(0,ECO.deckSize); }
  P.chf+=refund; lastPack={res,refund,name:pk.name,pid}; packOpen={res,name:pk.name,img:pk.img};
  save(); sfx("pack");
  if(res.some(r=>r.isNew&&CARDS[r.id].r==="L")) sfx("legend"); else if(res.some(r=>r.isNew)) sfx("rare");
  if(refund) setTimeout(()=>sfx("coin"),1300);
  render();
  const el=document.querySelector(`.packtile[data-pid="${pid}"] .pack`); if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const op=document.querySelector(".opened"); if(op) op.scrollIntoView({behavior:"smooth",block:"start"});
}
